<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showreel Mode Card — test locale</title>
<style>body { margin: 0; background: #151717; font-family: Arial, sans-serif; } pre { color: white; padding: 20px; }</style>
<showreel-mode-card></showreel-mode-card>
<pre id="results">Test in corso…</pre>
<script src="../custom_components/appartment_media_center/frontend/showreel-mode-card.js"></script>
<script>
(async () => {
  const results = document.querySelector('#results');
  let count = 0;
  const assert = (value, message) => { if (!value) throw new Error(message); count++; };
  const card = document.querySelector('showreel-mode-card');
  const entityId = 'select.schermo';
  const options = ['Automatico', 'Showreel video', 'Showreel foto', 'Schermo nero', 'Riunione'];
  let calls = [];
  const state = (value, availableOptions = options) => ({ state: value, attributes: { options: availableOptions } });
  const hass = {
    states: { [entityId]: state('Schermo nero') },
    callService: async (...args) => { calls.push(args); },
  };
  const buttons = () => [...card.shadowRoot.querySelectorAll('.grid button')];
  const pressed = () => buttons().map(b => b.getAttribute('aria-pressed') === 'true');
  const update = (value, availableOptions) => { hass.states[entityId] = state(value, availableOptions); card.hass = hass; };
  const flush = () => new Promise(resolve => setTimeout(resolve, 0));
  try {
    card.hass = hass; // HA can assign hass before setConfig.
    card.setConfig({ entity: entityId });
    assert(buttons().length === 5, 'Cinque modalità');
    assert(pressed()[3] && pressed().filter(Boolean).length === 1, 'Stato iniziale');
    for (const [width, columns] of [[375, 1], [800, 2], [1440, 5]]) {
      card.style.width = width + 'px';
      assert(getComputedStyle(card.shadowRoot.querySelector('.grid')).gridTemplateColumns.split(' ').length === columns, 'Colonne a ' + width);
      assert(card.scrollWidth === width, 'Nessun overflow a ' + width);
    }
    card.style.width = '';
    buttons()[3].click();
    assert(calls.length === 0, 'Nessuna chiamata per modalità attiva');
    let finish;
    hass.callService = (...args) => { calls.push(args); return new Promise(resolve => { finish = resolve; }); };
    buttons()[1].focus();
    buttons()[1].click();
    buttons()[0].click();
    assert(calls.length === 1 && buttons().every(b => b.disabled), 'Blocco durante richiesta');
    assert(JSON.stringify(calls[0]) === JSON.stringify(['select', 'select_option', { entity_id: entityId, option: options[1] }]), 'Payload esatto');
    assert(pressed()[3], 'Nessun aggiornamento ottimistico');
    finish(); await flush();
    assert(buttons().every(b => !b.disabled), 'Sblocco dopo risposta');
    update(options[1]);
    assert(pressed()[1], 'Aggiornamento dal backend');
    update(options[0]);
    assert(pressed()[0], 'Aggiornamento esterno');
    update('unavailable');
    assert(buttons().every(b => b.disabled) && !pressed().some(Boolean), 'Unavailable');
    update('unknown');
    assert(buttons().every(b => b.disabled), 'Unknown');
    hass.states = {}; card.hass = hass;
    assert(buttons().every(b => b.disabled) && card.shadowRoot.querySelector('.status').textContent.includes('non trovata'), 'Entità assente');
    update(options[0], options.slice(0, 3));
    assert(buttons()[3].disabled && !buttons()[1].disabled, 'Opzione mancante');
    update('Altro', [...options, 'Altro']);
    assert(!pressed().some(Boolean), 'Stato non mappato');
    update(options[0]);
    hass.callService = async () => { throw new Error('Permesso negato'); };
    buttons()[2].click(); await flush();
    assert(card.shadowRoot.querySelector('.status').textContent.includes('Permesso negato') && !buttons()[2].disabled, 'Errore servizio e possibilità di riprovare');
    for (const config of [{ entity: 'input_select.test' }, { entity: entityId, modes: [] }, { entity: entityId, modes: options.map(() => ({ option: 'duplicate' })) }]) {
      let thrown = false;
      try { card.setConfig(config); } catch { thrown = true; }
      assert(thrown, 'Validazione YAML');
    }
    const modes = options.map((label, i) => ({ label, option: String(i), description: '<img src=x onerror=alert(1)>' }));
    card.setConfig({ entity: entityId, modes });
    update('0', ['0', '1', '2', '3', '4']);
    assert(!card.shadowRoot.querySelector('img'), 'Stringhe YAML trattate come testo');
    hass.callService = async (...args) => calls.push(args);
    buttons()[2].click(); await flush();
    assert(calls.at(-1)[2].option === '2', 'Mappatura option separata da label');
    // Rich controls discover the actual entity IDs supplied by the integration.
    card.setConfig({ entity: entityId });
    const controls = { dismiss_keyring_prompt: 'button.studio_portachiavi', volume: 'number.studio_volume', muted: 'switch.studio_muto', meeting_title: 'text.studio_titolo',
      release_screen: 'button.studio_libera', refresh_showreel: 'button.studio_video', refresh_photos: 'button.studio_foto',
      sync_content: 'button.studio_sync', next_page: 'button.studio_next', previous_page: 'button.studio_previous', close_presentation: 'button.studio_close' };
    update('Riunione');
    const attrs = hass.states[entityId].attributes;
    Object.assign(attrs, { control_entities: controls, actual_content: 'meeting', airplay: 'idle', browser_ready: true,
      receiver_ready: true, panel_url: 'https://appartment.local:8443', presentation: null, jobs: [], errors: {} });
    for (const [key, id] of Object.entries(controls)) hass.states[id] = { state: key === 'volume' ? '45' : key === 'muted' ? 'off' : key === 'meeting_title' ? 'Benvenuti' : 'unknown', attributes: {} };
    card.hass = hass;
    assert(pressed()[4] && !card.shadowRoot.querySelector('.controls').hidden, 'Riunione e pannelli estesi');
    const control = key => card.shadowRoot.querySelector(`[data-control="${key}"]`);
    const volume = card.shadowRoot.querySelector('#volume');
    hass.callService = async (...args) => { calls.push(args); };
    volume.value = '72'; volume.dispatchEvent(new Event('change')); await flush();
    assert(JSON.stringify(calls.at(-1)) === JSON.stringify(['number', 'set_value', {entity_id: controls.volume, value: 72}]), 'Payload volume');
    control('muted').click(); await flush();
    assert(calls.at(-1)[0] === 'switch' && calls.at(-1)[1] === 'turn_on', 'Attiva muto');
    hass.states[controls.muted].state = 'on'; card.hass = hass;
    control('muted').click(); await flush();
    assert(calls.at(-1)[1] === 'turn_off', 'Disattiva muto');
    const title = card.shadowRoot.querySelector('#meeting-title');
    title.focus(); title.value = 'Riunione commerciale'; card.hass = hass;
    assert(title.value === 'Riunione commerciale', 'Polling non cancella il titolo in modifica');
    control('meeting_title').click(); await flush();
    assert(calls.at(-1)[0] === 'text' && calls.at(-1)[2].value === 'Riunione commerciale', 'Payload titolo');
    title.blur();
    const oldConfirm = window.confirm;
    window.confirm = () => false;
    const before = calls.length; control('release_screen').click(); await flush();
    assert(calls.length === before, 'Annullare Libera schermo non invia comandi');
    window.confirm = () => true; control('release_screen').click(); await flush();
    assert(calls.at(-1)[0] === 'button' && calls.at(-1)[2].entity_id === controls.release_screen, 'Conferma Libera schermo');
    window.confirm = oldConfirm;
    for (const key of ['dismiss_keyring_prompt', 'refresh_showreel', 'refresh_photos', 'sync_content', 'next_page', 'previous_page', 'close_presentation']) {
      control(key).click(); await flush();
      assert(calls.at(-1)[1] === 'press' && calls.at(-1)[2].entity_id === controls[key], 'Azione ' + key);
    }
    hass.states[controls.next_page].state = 'unavailable'; card.hass = hass;
    assert(control('next_page').disabled, 'Presentazione non disponibile');
    hass.states[controls.dismiss_keyring_prompt].state = 'unavailable'; card.hass = hass;
    assert(control('dismiss_keyring_prompt').disabled, 'Portachiavi disabilitato su backend precedente');
    attrs.jobs = [{kind: 'sync_content', status: 'running', progress: 42}]; card.hass = hass;
    assert(card.shadowRoot.querySelector('.job-summary').textContent.includes('42%'), 'Progresso attività');
    attrs.panel_url = 'javascript:alert(1)'; card.hass = hass;
    assert(card.shadowRoot.querySelector('.panel-link').hidden, 'URL pannello non sicuro nascosto');
    hass.states[entityId].state = 'unavailable'; card.hass = hass;
    assert(volume.disabled && [...card.shadowRoot.querySelectorAll('[data-control]')].every(b => b.disabled), 'Offline blocca controlli');
    hass.states[entityId].state = 'Riunione'; attrs.panel_url = 'https://appartment.local:8443'; card.hass = hass;
    card.setConfig({ entity: entityId, show_controls: false });
    assert(card.shadowRoot.querySelector('.controls').hidden, 'Layout compatto configurabile');
    // Keep a usable rich demo after the tests.
    card.setConfig({ entity: entityId });
    attrs.jobs = [{kind: 'refresh_photos', status: 'succeeded', progress: 100}];
    hass.callService = async (domain, service, data) => {
      if (domain === 'select') { hass.states[entityId].state = data.option; attrs.actual_content = {Automatico:'showreel', 'Showreel video':'showreel', 'Showreel foto':'photos', 'Schermo nero':'black', Riunione:'meeting'}[data.option]; }
      if (domain === 'number' || domain === 'text') hass.states[data.entity_id].state = String(data.value);
      if (domain === 'switch') hass.states[data.entity_id].state = service === 'turn_on' ? 'on' : 'off';
      card.hass = hass;
    };
    card.hass = hass;
    results.textContent = `PASS: ${count} verifiche. Demo interattiva con hass simulato.`;
    document.documentElement.dataset.testResult = 'pass';
  } catch (error) {
    results.textContent = 'FAIL: ' + error.stack;
    document.documentElement.dataset.testResult = 'fail';
  }
})();
</script>
</html>
